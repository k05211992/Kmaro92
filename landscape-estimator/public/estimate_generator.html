<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор смет — Ландшафтные работы</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d0520;color:#ffffff;min-height:100vh}
#app{max-width:1100px;margin:0 auto;padding:20px}
/* PROGRESS */
#prog-wrap{position:sticky;top:0;z-index:100;background:#0d0520;padding:12px 0 8px}
#prog-bar{height:3px;background:#2a1260;border-radius:2px}
#prog-fill{height:3px;background:#d4ff00;border-radius:2px;transition:width .4s}
#step-label{font-size:11px;color:rgba(255,255,255,0.5);margin-top:6px;letter-spacing:.08em}
/* SCREENS */
.screen{display:none}.screen.active{display:block}
/* CLIENT SCREEN */
.client-form{max-width:560px;padding-top:40px}
.q-title{font-size:28px;font-weight:600;color:#ffffff;margin-bottom:6px}
.q-sub{font-size:13px;color:rgba(255,255,255,0.55);margin-bottom:32px}
.field-group{display:flex;flex-direction:column;gap:16px;margin-bottom:32px}
.field-label{font-size:11px;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.tf{background:transparent;border:none;border-bottom:1.5px solid rgba(255,255,255,0.15);width:100%;padding:8px 0;font-size:16px;color:#ffffff;outline:none;font-family:inherit;transition:border-color .2s}
.tf:focus{border-bottom-color:#d4ff00}
.tf::placeholder{color:rgba(255,255,255,0.15)}
/* SECTION SELECTOR */
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:24px;margin-bottom:28px}
.sec-card{background:#1e0d42;border:.5px solid #3d1f7a;border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s,background .15s}
.sec-card:hover{border-color:#6b3fd4}
.sec-card.sel{background:#2d1065;border-color:#d4ff0088}
.sec-card-name{font-size:13px;font-weight:500;color:rgba(255,255,255,0.8);line-height:1.4}
.sec-card.sel .sec-card-name{color:#d4ff00}
.sec-card-count{font-size:11px;color:rgba(255,255,255,0.6);margin-top:4px}
.sec-card.sel .sec-card-count{color:#8caa00}
/* SECTION DETAIL */
.sec-detail{padding-top:24px}
.sec-nav{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.sec-tab{border:.5px solid rgba(255,255,255,0.1);border-radius:999px;padding:5px 14px;font-size:12px;color:rgba(255,255,255,0.55);cursor:pointer;background:rgba(255,255,255,0.04);white-space:nowrap;transition:all .12s}
.sec-tab:hover{color:rgba(255,255,255,0.8)}
.sec-tab.on{background:#2d1065;border-color:#d4ff0066;color:#d4ff00}
/* SEARCH */
.search-row{position:relative;margin-bottom:16px}
.s-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:rgba(255,255,255,0.2);fill:none;stroke-width:1.5;stroke-linecap:round}
.s-in{width:100%;background:rgba(255,255,255,0.06);border:.5px solid rgba(255,255,255,0.1);border-radius:8px;height:36px;padding:0 12px 0 33px;font-size:13px;color:#ffffff;font-family:inherit;outline:none}
.s-in:focus{border-color:rgba(212,255,0,0.3)}
.s-in::placeholder{color:rgba(255,255,255,0.15)}
/* WORK ROWS */
.works-table{width:100%;border-collapse:collapse}
.works-table th{font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:.07em;padding:6px 0;border-bottom:.5px solid rgba(255,255,255,0.08);text-align:left;font-weight:500}
.works-table th:last-child,.works-table td:last-child{text-align:right}
.works-table th:nth-child(3),.works-table td:nth-child(3){text-align:center}
.sub-header td{padding:10px 0 4px;font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.work-row{cursor:pointer;transition:background .1s}
.work-row:hover{background:rgba(255,255,255,0.04)}
.work-row.sel{background:rgba(212,255,0,0.06)}
.work-row td{padding:8px 6px;border-bottom:.5px solid rgba(255,255,255,0.05);font-size:12px;color:rgba(255,255,255,0.6);vertical-align:middle}
.work-row.sel td{color:rgba(255,255,255,0.85)}
.work-check{width:16px;height:16px;border:.5px solid rgba(255,255,255,0.15);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.work-row.sel .work-check{background:#d4ff00;border-color:#d4ff00}
.check-tick{width:8px;height:6px;stroke:#111;fill:none;stroke-width:2;stroke-linecap:round;display:none}
.work-row.sel .check-tick{display:block}
.work-name{color:rgba(255,255,255,0.92);font-size:13px}
.work-row.sel .work-name{color:#d4ff00}
.work-type-badge{font-size:10px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.45);white-space:nowrap}
.work-price{color:rgba(212,255,0,0.7);font-size:12px}
.work-row.sel .work-price{color:#d4ff00}
/* QTY INPUT */
.qty-wrap{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.qty-btn{width:24px;height:24px;border:.5px solid rgba(255,255,255,0.1);border-radius:5px;background:transparent;color:rgba(255,255,255,0.5);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qty-btn:hover{color:#d4ff00}
.qty-in{width:48px;background:rgba(255,255,255,0.06);border:.5px solid rgba(255,255,255,0.1);border-radius:5px;height:24px;text-align:center;font-size:13px;color:#ffffff;font-family:inherit;outline:none}
/* MATERIALS PANEL */
.mats-panel{background:rgba(255,255,255,0.04);border:.5px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px 16px;margin-top:20px}
.mats-title{font-size:10px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:12px}
.mat-suggest{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.mat-chip{border:.5px solid rgba(255,255,255,0.1);border-radius:6px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,0.35);cursor:pointer;background:rgba(255,255,255,0.04)}
.mat-chip:hover{border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.6)}
.mat-chip.sel{background:rgba(212,255,0,0.1);border-color:rgba(212,255,0,0.4);color:#d4ff00}
.mat-rows{display:flex;flex-direction:column;gap:6px}
.mat-row{display:flex;align-items:center;gap:6px}
.mat-name-in{flex:1;background:rgba(255,255,255,0.06);border:.5px solid rgba(255,255,255,0.1);border-radius:6px;height:28px;padding:0 8px;font-size:12px;color:rgba(255,255,255,0.92);font-family:inherit;outline:none}
.mat-name-in::placeholder{color:rgba(255,255,255,0.15)}
.mat-name-in:focus{border-color:rgba(212,255,0,0.3)}
.mat-qty-in{width:52px;background:rgba(255,255,255,0.06);border:.5px solid rgba(255,255,255,0.1);border-radius:6px;height:28px;padding:0 6px;font-size:12px;color:rgba(255,255,255,0.9);font-family:inherit;outline:none;text-align:center}
.mat-unit-in{width:40px;background:rgba(255,255,255,0.06);border:.5px solid rgba(255,255,255,0.1);border-radius:6px;height:28px;padding:0 5px;font-size:11px;color:rgba(255,255,255,0.55);font-family:inherit;outline:none;text-align:center}
.mat-del{width:20px;height:20px;background:transparent;border:none;color:rgba(255,255,255,0.15);cursor:pointer;font-size:14px;flex-shrink:0}
.mat-price-in{width:72px;background:rgba(255,255,255,0.06);border:.5px solid rgba(255,255,255,0.1);border-radius:6px;height:28px;padding:0 6px;font-size:12px;color:#d4ff00;font-family:inherit;outline:none;text-align:right}
.mat-price-in::placeholder{color:rgba(255,255,255,0.12)}
.mat-price-in:focus{border-color:rgba(212,255,0,0.3)}
.mat-del:hover{color:rgba(255,255,255,0.5)}
.mat-add-btn{background:none;border:none;font-size:11px;color:rgba(255,255,255,0.4);cursor:pointer;font-family:inherit;margin-top:8px;padding:0}
.mat-add-btn:hover{color:rgba(255,255,255,0.5)}
/* SUMMARY */
.summary-wrap{display:grid;grid-template-columns:1fr 380px;gap:20px;padding-top:24px}
.summary-sections{display:flex;flex-direction:column;gap:16px}
.sum-sec{background:rgba(255,255,255,0.04);border:.5px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden}
.sum-sec-head{padding:10px 14px;font-size:12px;font-weight:500;color:#a89060;border-bottom:.5px solid #1a1a1a}
.sum-row{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 14px;border-bottom:.5px solid #161616;gap:12px}
.sum-row:last-child{border-bottom:none}
.sum-work-name{font-size:12px;color:#aaa;flex:1;line-height:1.4}
.sum-work-detail{font-size:11px;color:#444;margin-top:2px}
.sum-work-price{font-size:12px;color:#e8d5a3;white-space:nowrap;font-weight:500}
.sum-mat-row{padding:4px 14px 4px 24px;font-size:11px;color:#444;display:flex;justify-content:space-between}
.sum-table{width:100%;border-collapse:collapse;font-size:12px}
.sum-table th{font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:.07em;font-weight:500;padding:6px 14px;border-bottom:.5px solid #1a1a1a;text-align:left}
.sum-table th:nth-child(3),.sum-table th:nth-child(4),.sum-table th:nth-child(5){text-align:right}
.sum-table td{padding:8px 14px;border-bottom:.5px solid rgba(255,255,255,0.06);vertical-align:top;color:rgba(255,255,255,0.6)}
.sum-table td:nth-child(3),.sum-table td:nth-child(4),.sum-table td:nth-child(5){text-align:right;white-space:nowrap}
.sum-table td:nth-child(4){color:rgba(212,255,0,0.7)}
.sum-table td:nth-child(5){color:#d4ff00;font-weight:500}
.sum-table tr:last-child td{border-bottom:none}
.sum-table .mat-line td{color:rgba(255,255,255,0.45);font-style:italic}
.sum-table .mat-line td:nth-child(4),.sum-table .mat-line td:nth-child(5){color:rgba(255,255,255,0.15)}
.sum-sec-head{padding:10px 14px;font-size:12px;font-weight:500;color:rgba(255,255,255,0.75);font-size:13px;border-bottom:.5px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center}
.sum-sec-total{font-size:13px;color:#d4ff00}
/* TOTALS */
.totals-card{background:rgba(255,255,255,0.04);border:.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:16px;position:sticky;top:80px}
.tot-title{font-size:11px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px}
.tot-row{display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,0.65);padding:4px 0}
.tot-row.big{font-size:18px;color:#ffffff;font-weight:500;padding-top:10px;margin-top:6px;border-top:.5px solid rgba(255,255,255,0.1)}
.tot-row.big span:last-child{color:#d4ff00}
/* CLIENT INFO CARD */
.cli-card{background:rgba(255,255,255,0.04);border:.5px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.cli-name{font-size:15px;font-weight:500;color:#d4ff00;margin-bottom:4px}
.cli-detail{font-size:12px;color:rgba(255,255,255,0.55)}
/* BUTTONS */
.btn-row{display:flex;align-items:center;gap:10px;margin-top:24px}
.btn-primary{background:#d4ff00;color:#0d0520;border:none;border-radius:7px;height:40px;padding:0 24px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-primary:hover{opacity:.88}
.btn-primary:disabled{opacity:.3;cursor:default}
.btn-back{background:transparent;border:.5px solid rgba(255,255,255,0.15);border-radius:7px;height:40px;width:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,0.55);font-size:16px;flex-shrink:0}
.btn-back:hover{border-color:rgba(255,255,255,0.35);color:rgba(255,255,255,0.7)}
.btn-ghost{background:transparent;border:.5px solid rgba(255,255,255,0.15);border-radius:7px;height:40px;padding:0 18px;font-size:13px;color:rgba(255,255,255,0.4);cursor:pointer;font-family:inherit}
.btn-ghost:hover{color:rgba(255,255,255,0.75)}
.sel-counter{font-size:12px;color:#666;margin-left:4px}
/* NO RESULTS */
.no-res{text-align:center;font-size:13px;color:rgba(255,255,255,0.35);padding:32px 0}
.sec-subtotal-bar{font-size:14px;font-weight:600;color:#d4ff00;font-weight:500;text-align:right;padding:10px 0 0;min-height:20px}
/* SECTION PROGRESS DOTS */
.sec-dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:20px}
.sec-dot{height:3px;border-radius:2px;background:rgba(255,255,255,0.1);flex:1;min-width:20px;max-width:40px;transition:background .2s}
.sec-dot.done{background:#8caa00}
.sec-dot.active{background:#d4ff00}
/* COEF */
.coef-row{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.coef-label{font-size:13px;color:#666;min-width:200px}
input[type=range]{-webkit-appearance:none;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;outline:none;flex:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#d4ff00;cursor:pointer}
.coef-val{font-size:14px;color:#e8d5a3;font-weight:500;min-width:40px;text-align:right}
/* PRINT */
@media print{
  #prog-wrap,#btn-area{display:none!important}
  body{background:#fff;color:#111}
  .totals-card,.sum-sec{border:1px solid #ddd}
}
</style>
</head>
<body>
<div id="app">
  <div id="prog-wrap">
    <div id="prog-bar"><div id="prog-fill" style="width:0%"></div></div>
    <div id="step-label">Шаг 1 из 4</div>
  </div>

  <!-- STEP 1: CLIENT -->
  <div class="screen active" id="s-client">
    <div class="client-form">
      <div class="q-title">Данные клиента</div>
      <div class="q-sub">Все поля необязательны — можно пропустить</div>
      <div class="field-group">
        <div>
          <div class="field-label">Имя клиента</div>
          <input class="tf" id="f-client" placeholder="Например: Иванов Александр">
        </div>
        <div>
          <div class="field-label">Телефон</div>
          <input class="tf" id="f-phone" placeholder="+7 (___) ___-__-__">
        </div>
        <div>
          <div class="field-label">Адрес объекта</div>
          <input class="tf" id="f-addr" placeholder="Например: ул. Садовая, 12">
        </div>
        <div>
          <div class="field-label">Примечание</div>
          <input class="tf" id="f-note" placeholder="Особые условия, сроки...">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-next-client">Выбрать разделы →</button>
        <button class="btn-ghost" onclick="goTo(2)">Пропустить</button>
      </div>
    </div>
  </div>

  <!-- STEP 2: SELECT SECTIONS -->
  <div class="screen" id="s-sections">
    <div class="q-title" style="padding-top:24px">Разделы работ</div>
    <div class="q-sub">Выберите все применимые — по каждому заполните работы отдельно</div>
    <div class="sec-grid" id="sec-grid"></div>
    <div class="btn-row">
      <button class="btn-back" onclick="goTo(1)">←</button>
      <button class="btn-primary" id="btn-next-sections">Заполнить работы →</button>
      <span class="sel-counter" id="sec-counter">ничего не выбрано</span>
    </div>
  </div>

  <!-- STEP 3: FILL SECTIONS -->
  <div class="screen" id="s-works">
    <div class="sec-dots" id="sec-dots"></div>
    <div id="sec-detail-wrap"></div>
    <div class="btn-row" id="works-btns">
      <button class="btn-back" id="btn-prev-sec">←</button>
      <button class="btn-primary" id="btn-next-sec">Следующий раздел →</button>
    </div>
  </div>

  <!-- STEP 4: SUMMARY -->
  <div class="screen" id="s-summary">
    <div class="q-title" style="padding-top:16px">Смета</div>
    <div class="coef-row" style="margin-top:16px">
      <div class="coef-label">Коэффициент сложности объекта</div>
      <input type="range" id="coef-slider" min="1" max="1.5" step="0.1" value="1">
      <span class="coef-val" id="coef-val">×1.0</span>
    </div>
    <div class="summary-wrap">
      <div class="summary-sections" id="summary-sections"></div>
      <div>
        <div class="cli-card" id="cli-card"></div>
        <div class="totals-card" id="totals-card"></div>
        <div class="btn-row" style="margin-top:14px">
          <button class="btn-back" onclick="goTo(3)">←</button>
          <button class="btn-ghost" onclick="window.print()">Печать</button>
          <button class="btn-primary" onclick="resetAll()">Новая смета</button>
        </div>
      </div>
    </div>
  </div>
</div>

let state = {
  client:'', phone:'', addr:'', note:'',
  selSections: [],
  curSecIdx: 0,
  works: {},
  mats: {},
  coef: 1.0,
  _pendingQty: {},
};

const fmt = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const fmtN = n => parseFloat(n.toFixed(2));

// Build section index
const SEC_MAP = {};
CATALOG.sections.forEach(s => { SEC_MAP[s.id] = s; });

// ---- STEP 1 ----
document.getElementById('btn-next-client').onclick = () => {
  state.client = document.getElementById('f-client').value.trim();
  state.phone  = document.getElementById('f-phone').value.trim();
  state.addr   = document.getElementById('f-addr').value.trim();
  state.note   = document.getElementById('f-note').value.trim();
  goTo(2);
};

// ---- STEP 2 ----
function buildSectionGrid() {
  const grid = document.getElementById('sec-grid');
  grid.innerHTML = '';
  CATALOG.sections.forEach(s => {
    const totalWorks = Object.values(s.subsections).reduce((a,v)=>a+v.length,0);
    const div = document.createElement('div');
    div.className = 'sec-card' + (state.selSections.includes(s.id) ? ' sel' : '');
    div.innerHTML = `<div class="sec-card-name">${s.name}</div><div class="sec-card-count">${totalWorks} работ</div>`;
    div.onclick = () => {
      const idx = state.selSections.indexOf(s.id);
      if(idx===-1) state.selSections = [s.id];
      else state.selSections = [];
      buildSectionGrid();
      updateSecCounter();
    };
    grid.appendChild(div);
  });
}

function updateSecCounter() {
  const n = state.selSections.length;
  const el = document.getElementById('sec-counter');
  el.textContent = n===0 ? 'ничего не выбрано' : `выбрано: ${n}`;
  document.getElementById('btn-next-sections').disabled = n===0;
}

document.getElementById('btn-next-sections').onclick = () => {
  if(state.selSections.length===0) return;
  state.curSecIdx = 0;
  buildWorkScreen();
  goTo(3);
};

// ---- STEP 3 ----
function buildWorkScreen() {
  buildSecDots();
  renderCurrentSection();
  updateWorksBtns();
}

function buildSecDots() {
  const wrap = document.getElementById('sec-dots');
  wrap.innerHTML = state.selSections.map((id,i) =>
    `<div class="sec-dot ${i<state.curSecIdx?'done':i===state.curSecIdx?'active':''}" title="${SEC_MAP[id]?.name}"></div>`
  ).join('');
}

function renderCurrentSection() {
  const secId = state.selSections[state.curSecIdx];
  const sec = SEC_MAP[secId];
  if(!sec) return;
  if(!state.works[secId]) state.works[secId] = {};
  if(!state.mats[secId]) state.mats[secId] = [];

  const wrap = document.getElementById('sec-detail-wrap');
  const subsKeys = Object.keys(sec.subsections);

  let html = `<div class="sec-detail">
    <div class="q-title">${sec.name}</div>
    <div class="q-sub" style="margin-bottom:16px">Выберите работы и укажите количество</div>
    <div class="search-row">
      <svg class="s-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5l4 4"/></svg>
      <input class="s-in" id="work-search" placeholder="Поиск работ...">
    </div>
    <div class="sec-nav" id="sub-tabs">`;

  subsKeys.forEach((sub,i) => {
    html += `<div class="sec-tab ${i===0?'on':''}" data-sub="${encodeURIComponent(sub)}" onclick="setSubTab(this,'${secId}')">${sub}</div>`;
  });
  html += `</div>
    <table class="works-table">
      <thead><tr>
        <th style="width:24px"></th>
        <th>Работа</th>
        <th style="width:80px">Тип</th>
        <th style="width:70px">Цена/ед.</th>
        <th style="width:130px">Количество</th>
        <th style="width:90px">Сумма</th>
      </tr></thead>
      <tbody id="works-tbody"></tbody>
    </table>`;

  // Materials panel
  const mats = sec.materials;
  if(mats.length > 0) {
    html += `<div class="mats-panel">
      <div class="mats-title">Материалы по разделу</div>
      <div class="mat-suggest" id="mat-suggest">`;
    mats.slice(0,20).forEach(mat => {
      const isSel = state.mats[secId].some(m=>m.name===mat.name);
      const safeName = mat.name.replace(/'/g,"\'").replace(/"/g,'&quot;');
      html += `<div class="mat-chip ${isSel?'sel':''}" data-name="${mat.name.replace(/"/g,'&quot;')}" onclick="toggleMatChip('${secId}','${safeName}','${mat.unit}')">${mat.name}</div>`;
    });
    html += `</div>
      <div class="mat-rows" id="mat-rows"></div>
      <button class="mat-add-btn" onclick="addMatRow('${secId}')">+ добавить материал вручную</button>
    </div>`;
  }

  html += `<div class="sec-subtotal-bar" id="sec-subtotal"></div></div>`;
  wrap.innerHTML = html;

  // Render first subtab
  renderSubTable(secId, subsKeys[0]);
  renderMatRows(secId);

  document.getElementById('work-search').oninput = function() {
    filterWorks(secId, this.value);
  };
}

function setSubTab(el, secId) {
  document.querySelectorAll('#sub-tabs .sec-tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  const sub = decodeURIComponent(el.dataset.sub);
  renderSubTable(secId, sub);
}

function renderSubTable(secId, sub) {
  const sec = SEC_MAP[secId];
  const tbody = document.getElementById('works-tbody');
  if(!tbody) return;
  const works = sec.subsections[sub] || [];
  const q = document.getElementById('work-search')?.value?.toLowerCase() || '';
  const filtered = q ? works.filter(w=>w.name.toLowerCase().includes(q)) : works;
  tbody.innerHTML = filtered.map(w => {
    const sel = !!state.works[secId]?.[w.id];
    const qty = state.works[secId]?.[w.id]?.qty || 1;
    const priceDisp = w.price > 0 ? w.price.toLocaleString('ru-RU') : '—';
    const lineTotal = sel && w.price > 0 ? (w.price * qty).toLocaleString('ru-RU') + ' ₽' : '';
    return `<tr class="work-row ${sel?'sel':''}" id="wr-${w.id}" onclick="toggleWork('${secId}','${w.id}','${w.name.replace(/'/g,"\'")}','${w.unit}',${w.price})">
      <td><span class="work-check"><svg class="check-tick" viewBox="0 0 10 8"><path d="M1 4l3 3 5-6"/></svg></span></td>
      <td><div class="work-name">${w.name}</div></td>
      <td><span class="work-type-badge">${w.type}</span></td>
      <td class="work-price">${priceDisp} ₽</td>
      <td><div class="qty-wrap" onclick="event.stopPropagation()">
        <button class="qty-btn" onclick="changeQty('${secId}','${w.id}',-1)">−</button>
        <input class="qty-in" id="qty-${w.id}" type="number" min="0.1" step="any" value="${qty}" oninput="setQty('${secId}','${w.id}',this.value);updateLineTotal('${w.id}',${w.price},this.value)">
        <button class="qty-btn" onclick="changeQty('${secId}','${w.id}',1)">+</button>
        <span style="font-size:11px;color:#444;margin-left:4px">${w.unit}</span>
      </div></td>
      <td class="work-price" id="lt-${w.id}" style="color:${sel?'#a89060':'#2a2a2a'}">${lineTotal}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" class="no-res">Нет работ в этом подразделе</td></tr>';
}

function filterWorks(secId, q) {
  const sec = SEC_MAP[secId];
  const tbody = document.getElementById('works-tbody');
  if(!tbody) return;
  const ql = q.toLowerCase();
  let html = '';
  Object.entries(sec.subsections).forEach(([sub, works]) => {
    const filtered = ql ? works.filter(w=>w.name.toLowerCase().includes(ql)) : [];
    if(ql && filtered.length > 0) {
      html += `<tr class="sub-header"><td colspan="5">${sub}</td></tr>`;
      filtered.forEach(w => {
        const sel = !!state.works[secId]?.[w.id];
        const qty = state.works[secId]?.[w.id]?.qty || 1;
        const priceDisp = w.price > 0 ? w.price.toLocaleString('ru-RU') : '—';
        const lt2 = sel && w.price > 0 ? (w.price * qty).toLocaleString('ru-RU') + ' ₽' : '';
        html += `<tr class="work-row ${sel?'sel':''}" id="wr-${w.id}" onclick="toggleWork('${secId}','${w.id}','${w.name.replace(/'/g,"\'")}','${w.unit}',${w.price})">
          <td><span class="work-check"><svg class="check-tick" viewBox="0 0 10 8"><path d="M1 4l3 3 5-6"/></svg></span></td>
          <td><div class="work-name">${w.name}</div></td>
          <td><span class="work-type-badge">${w.type}</span></td>
          <td class="work-price">${priceDisp} ₽</td>
          <td><div class="qty-wrap" onclick="event.stopPropagation()">
            <button class="qty-btn" onclick="changeQty('${secId}','${w.id}',-1)">−</button>
            <input class="qty-in" id="qty-${w.id}" type="number" min="0.1" step="any" value="${qty}" oninput="setQty('${secId}','${w.id}',this.value);updateLineTotal('${w.id}',${w.price},this.value)">
            <button class="qty-btn" onclick="changeQty('${secId}','${w.id}',1)">+</button>
            <span style="font-size:11px;color:#444;margin-left:4px">${w.unit}</span>
          </div></td>
          <td class="work-price" id="lt-${w.id}" style="color:${sel?'#a89060':'#2a2a2a'}">${lt2}</td>
        </tr>`;
      });
    }
  });
  if(!ql) {
    // show current active tab
    const activeTab = document.querySelector('#sub-tabs .sec-tab.on');
    if(activeTab) renderSubTable(secId, decodeURIComponent(activeTab.dataset.sub));
  } else {
    tbody.innerHTML = html || '<tr><td colspan="5" class="no-res">Ничего не найдено</td></tr>';
  }
}

function updateLineTotal(wId, price, val) {
  const cell = document.getElementById('lt-'+wId);
  const row = document.getElementById('wr-'+wId);
  if(!cell || !row) return;
  const qty = Math.max(0.1, parseFloat(val)||1);
  if(row.classList.contains('sel') && price > 0) {
    cell.textContent = (price * qty).toLocaleString('ru-RU') + ' ₽';
    cell.style.color = '#a89060';
  }
  updateSecSubtotal();
}

function updateSecSubtotal() {
  const secId = state.selSections[state.curSecIdx];
  if(!secId) return;
  let total = 0;
  Object.values(state.works[secId]||{}).forEach(w => {
    const inp = document.getElementById('qty-'+w.id);
    const qty = inp ? (parseFloat(inp.value)||w.qty) : w.qty;
    total += w.price * qty;
  });
  const bar = document.getElementById('sec-subtotal');
  if(bar) bar.textContent = total > 0 ? 'Итог по разделу: ' + total.toLocaleString('ru-RU') + ' ₽' : '';
}

function saveAllQty(secId) {
  document.querySelectorAll('.qty-in').forEach(inp => {
    const wId = inp.id.replace('qty-','');
    if(state.works[secId]?.[wId]) {
      state.works[secId][wId].qty = Math.max(0.1, parseFloat(inp.value)||1);
    }
  });
}

function toggleWork(secId, wId, name, unit, price) {
  if(!state.works[secId]) state.works[secId] = {};
  if(state.works[secId][wId]) {
    delete state.works[secId][wId];
  } else {
    const inp = document.getElementById('qty-'+wId);
    const pending = state._pendingQty?.[wId];
    const qty = pending || (inp ? Math.max(0.1, parseFloat(inp.value)||1) : 1);
    if(state._pendingQty) delete state._pendingQty[wId];
    state.works[secId][wId] = {name, unit, price: parseFloat(price)||0, qty};
  }
  const row = document.getElementById('wr-'+wId);
  if(row) row.classList.toggle('sel', !!state.works[secId][wId]);
  const cell = document.getElementById('lt-'+wId);
  if(cell) {
    const w = state.works[secId]?.[wId];
    if(w && w.price > 0) {
      cell.textContent = (w.price * w.qty).toLocaleString('ru-RU') + ' ₽';
      cell.style.color = '#a89060';
    } else {
      cell.textContent = '';
    }
  }
  updateSecSubtotal();
}

function changeQty(secId, wId, delta) {
  const inp = document.getElementById('qty-'+wId);
  if(!inp) return;
  const cur = parseFloat(inp.value)||1;
  const nv = Math.max(0.1, fmtN(cur+delta));
  inp.value = nv;
  if(state.works[secId]?.[wId]) {
    state.works[secId][wId].qty = nv;
    const cell = document.getElementById('lt-'+wId);
    const w = state.works[secId][wId];
    if(cell && w.price > 0) cell.textContent = (w.price * nv).toLocaleString('ru-RU') + ' ₽';
    updateSecSubtotal();
  } else { if(!state._pendingQty) state._pendingQty={}; state._pendingQty[wId]=nv; }
}

function setQty(secId, wId, val) {
  const nv = Math.max(0.1, parseFloat(val)||1);
  if(state.works[secId]?.[wId]) state.works[secId][wId].qty = nv;
  else { if(!state._pendingQty) state._pendingQty={}; state._pendingQty[wId]=nv; }
}

function toggleMatChip(secId, name, unit) {
  saveMats(secId);
  const idx = state.mats[secId].findIndex(m=>m.name===name);
  if(idx===-1) state.mats[secId].push({name, qty:'', unit, price:''});
  else state.mats[secId].splice(idx,1);
  document.querySelectorAll('.mat-chip').forEach(chip => {
    chip.classList.toggle('sel', state.mats[secId].some(m=>m.name===chip.dataset.name));
  });
  renderMatRows(secId);
}

function addMatRow(secId) {
  state.mats[secId].push({name:'',qty:'',unit:'',price:''});
  renderMatRows(secId);
  setTimeout(()=>{
    const rows = document.querySelectorAll('.mat-name-in');
    if(rows.length) rows[rows.length-1].focus();
  },50);
}

function delMatRow(secId, i) {
  saveMats(secId);
  state.mats[secId].splice(i,1);
  renderMatRows(secId);
}

function saveMats(secId) {
  const rows = document.querySelectorAll('#mat-rows .mat-row');
  state.mats[secId] = Array.from(rows).map(r=>({
    name: r.querySelector('.mat-name-in')?.value||'',
    qty:   r.querySelector('.mat-qty-in')?.value||'',
    unit:  r.querySelector('.mat-unit-in')?.value||'',
    price: r.querySelector('.mat-price-in')?.value||'',
  })).filter(m=>m.name.trim());
}

function renderMatRows(secId) {
  const wrap = document.getElementById('mat-rows');
  if(!wrap) return;
  const mats = state.mats[secId] || [];
  wrap.innerHTML = mats.map((m,i)=>`<div class="mat-row">
    <input class="mat-name-in" placeholder="Материал" value="${m.name.replace(/"/g,'&quot;')}">
    <input class="mat-qty-in" placeholder="кол-во" value="${m.qty}">
    <input class="mat-unit-in" placeholder="ед." value="${m.unit}">
    <input class="mat-price-in" placeholder="цена ₽" value="${m.price||''}">
    <button class="mat-del" onclick="delMatRow('${secId}',${i})">×</button>
  </div>`).join('');
}

function updateWorksBtns() {
  const total = state.selSections.length;
  const cur = state.curSecIdx;
  const nextBtn = document.getElementById('btn-next-sec');
  nextBtn.textContent = cur >= total-1 ? 'Итог →' : 'Следующий раздел →';
}

document.getElementById('btn-next-sec').onclick = () => {
  const secId = state.selSections[state.curSecIdx];
  saveAllQty(secId);
  saveMats(secId);
  if(state.curSecIdx < state.selSections.length-1) {
    state.curSecIdx++;
    buildWorkScreen();
    window.scrollTo(0,0);
  } else {
    buildSummary();
    goTo(4);
  }
};

document.getElementById('btn-prev-sec').onclick = () => {
  const secId = state.selSections[state.curSecIdx];
  saveAllQty(secId);
  saveMats(secId);
  if(state.curSecIdx > 0) {
    state.curSecIdx--;
    buildWorkScreen();
    window.scrollTo(0,0);
  } else {
    goTo(2);
  }
};

// ---- STEP 4: SUMMARY ----
document.getElementById('coef-slider').oninput = function() {
  state.coef = parseFloat(this.value);
  document.getElementById('coef-val').textContent = '×' + state.coef.toFixed(1);
  renderSummaryTable();
  updateTotals();
};

function buildSummary() {
  // Client card
  const date = new Date().toLocaleDateString('ru-RU');
  const hasClient = state.client || state.addr || state.phone;
  document.getElementById('cli-card').innerHTML = hasClient ? `
    <div class="cli-name">${state.client || 'Клиент не указан'}</div>
    <div class="cli-detail">${[state.addr, state.phone].filter(Boolean).join(' · ')}</div>
    <div class="cli-detail" style="margin-top:2px">${[date, state.note].filter(Boolean).join(' · ')}</div>` :
    `<div class="cli-detail" style="color:#3a3a3a">${date}</div>`;

  renderSummaryTable();
  updateTotals();
}

function renderSummaryTable() {
  const wrap = document.getElementById('summary-sections');
  wrap.innerHTML = '';
  const coef = state.coef;

  state.selSections.forEach(secId => {
    const works = state.works[secId] || {};
    const mats = (state.mats[secId] || []).filter(m=>m.name.trim());
    const selWorks = Object.values(works);
    if(selWorks.length === 0 && mats.length === 0) return;
    const sec = SEC_MAP[secId];

    const matTotal = mats.reduce((a,m)=>a+(parseFloat(m.price)||0)*(parseFloat(m.qty)||0),0);
    const secTotal = selWorks.reduce((a,w) => a + Math.round(w.price * coef) * w.qty, 0) + matTotal;

    const div = document.createElement('div');
    div.className = 'sum-sec';

    let rows = '';
    selWorks.forEach(w => {
      const adjPrice = Math.round(w.price * coef);
      const lineTotal = adjPrice * w.qty;
      rows += `<tr>
        <td>${w.name}</td>
        <td>${w.unit}</td>
        <td>${w.qty}</td>
        <td>${adjPrice > 0 ? adjPrice.toLocaleString('ru-RU') + ' ₽' : '—'}</td>
        <td>${adjPrice > 0 ? lineTotal.toLocaleString('ru-RU') + ' ₽' : '—'}</td>
      </tr>`;
    });

    if(mats.length) {
      mats.forEach(m => {
        rows += `<tr class="mat-line">
          <td>${m.name}</td>
          <td>${m.unit || '—'}</td>
          <td>${m.qty || '—'}</td>
          <td>—</td>
          <td>—</td>
        </tr>`;
      });
    }

    div.innerHTML = `
      <div class="sum-sec-head">
        <span>${sec.name}</span>
        <span class="sum-sec-total">${secTotal > 0 ? secTotal.toLocaleString('ru-RU') + ' ₽' : ''}</span>
      </div>
      <table class="sum-table">
        <thead><tr>
          <th>Наименование</th>
          <th>Ед.</th>
          <th>Кол-во</th>
          <th>Цена</th>
          <th>Сумма</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    wrap.appendChild(div);
  });
}

function updateTotals() {
  const coef = state.coef;
  let total = 0;
  state.selSections.forEach(secId => {
    Object.values(state.works[secId]||{}).forEach(w => {
      total += Math.round(w.price * coef) * w.qty;
    });
    (state.mats[secId]||[]).filter(m=>m.name.trim()).forEach(m => {
      total += (parseFloat(m.price)||0)*(parseFloat(m.qty)||0);
    });
  });
  document.getElementById('totals-card').innerHTML = `
    <div class="tot-title">Итог по смете</div>
    <div class="tot-row big"><span>Итого</span><span>${total.toLocaleString('ru-RU')} ₽</span></div>`;
}

// ---- NAVIGATION ----
const STEPS = ['s-client','s-sections','s-works','s-summary'];
const PROG = [10,30,70,100];
const LABELS = ['Шаг 1 из 4 — Данные клиента','Шаг 2 из 4 — Выбор разделов','Шаг 3 из 4 — Состав работ','Шаг 4 из 4 — Смета'];

function goTo(step) {
  STEPS.forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(STEPS[step-1]).classList.add('active');
  document.getElementById('prog-fill').style.width = PROG[step-1]+'%';
  document.getElementById('step-label').textContent = LABELS[step-1];
  window.scrollTo(0,0);
  if(step===2) { buildSectionGrid(); updateSecCounter(); }
}

function resetAll() {
  state = {client:'',phone:'',addr:'',note:'',selSections:[],curSecIdx:0,works:{},mats:{},coef:1.0,_pendingQty:{}};
  document.getElementById('f-client').value='';
  document.getElementById('f-phone').value='';
  document.getElementById('f-addr').value='';
  document.getElementById('f-note').value='';
  document.getElementById('coef-slider').value=1;
  document.getElementById('coef-val').textContent='×1.0';
  goTo(1);
}

// Init
buildSectionGrid();
updateSecCounter();
</script>
</body>
</html>
